<div class="auth-card">
  <img src="images/placeholder-logo.svg" alt="Petal Planner logo" />
  <h1>Petal Planner</h1>
  <p class="tagline">your cosy corner for everything</p>
  <form id="auth-form">
    <label for="auth-email">Email</label>
    <input type="email" id="auth-email" placeholder="you@example.com" />
    <label for="auth-password">Password</label>
    <input type="password" id="auth-password" placeholder="••••••••" />
    <button type="submit" class="btn-primary" id="auth-submit">Sign in</button>
  </form>
  <p class="auth-toggle">or <a href="#" id="auth-toggle-link">Create account</a></p>
  <p class="auth-privacy">Your notes are yours alone.</p>
</div>
