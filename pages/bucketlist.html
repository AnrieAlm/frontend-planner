<div class="bucketlist-header">
  <div>
    <h2>Bucket List</h2>
    <span class="subtitle">everything you want to do, watch, and see</span>
  </div>
  <button class="btn-add-bucket" data-modal="bucket-item">+ Add item</button>
</div>

<div class="bucket-categories" role="tablist" aria-label="Bucket list categories">
  <button type="button" class="bucket-cat cat-movies active" data-category="movies" role="tab" aria-selected="true">🎬 Movies <strong>3</strong></button>
  <button type="button" class="bucket-cat cat-places" data-category="places" role="tab" aria-selected="false">📍 Places <strong>4</strong></button>
  <button type="button" class="bucket-cat cat-things" data-category="things" role="tab" aria-selected="false">📦 Things <strong>2</strong></button>
  <button type="button" class="bucket-cat cat-experiences" data-category="experiences" role="tab" aria-selected="false">✨ Experiences <strong>5</strong></button>
</div>

<!-- Movies -->
<div class="bucket-section" id="section-movies">
  <h3>🎬 Movies</h3>
  <button type="button" class="bucket-item"><span><strong>Dune: Part Three</strong><span class="bucket-detail">When it comes out</span></span></button>
  <button type="button" class="bucket-item"><span><strong>Past Lives</strong><span class="bucket-detail">Celine Song, 2023</span></span></button>
</div>

<!-- Places -->
<div class="bucket-section" id="section-places">
  <h3>📍 Places</h3>
  <button type="button" class="bucket-item"><span><strong>Azores, Portugal</strong><span class="bucket-detail">Spring — hot springs and green hills</span></span></button>
  <button type="button" class="bucket-item"><span><strong>Lisbon</strong><span class="bucket-detail">Finally, properly</span></span></button>
  <button type="button" class="bucket-item"><span><strong>Goa family trip</strong><span class="bucket-detail">With Boris, December</span></span></button>
  <button type="button" class="bucket-item"><span><strong>Scottish Highlands</strong><span class="bucket-detail">Cottage for a weekend</span></span></button>
</div>

<!-- Things -->
<div class="bucket-section" id="section-things">
  <h3>📦 Things</h3>
  <button type="button" class="bucket-item"><span><strong>Grow herbs on windowsill</strong><span class="bucket-detail">Lavender, mint, thyme</span></span></button>
  <button type="button" class="bucket-item"><span><strong>Learn sourdough</strong><span class="bucket-detail">Proper starter from scratch</span></span></button>
</div>

<!-- Experiences -->
<div class="bucket-section" id="section-experiences">
  <h3>✨ Experiences</h3>
  <button type="button" class="bucket-item"><span><strong>See Northern Lights</strong><span class="bucket-detail">Iceland or Norway</span></span></button>
  <button type="button" class="bucket-item"><span><strong>Pottery class</strong><span class="bucket-detail">With Esgi or Grace</span></span></button>
  <button type="button" class="bucket-item"><span><strong>Cook a Sunday roast</strong><span class="bucket-detail">For everyone</span></span></button>
  <button type="button" class="bucket-item"><span><strong>Watch a sunrise</strong><span class="bucket-detail">Somewhere beautiful</span></span></button>
  <button type="button" class="bucket-item"><span><strong>Write a short story</strong><span class="bucket-detail">A proper one</span></span></button>
</div>

<!-- Done shelf — collapsed by default, js/bucketlist.js's initDoneToggle() handles this -->
<button class="bucket-done-toggle">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="16" height="16" aria-hidden="true">
    <path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"/>
  </svg>
  Done <span aria-hidden="true">·</span> 1
</button>
<div class="bucket-section">
  <button type="button" class="bucket-item done"><span><strong>Poor Things</strong><span class="bucket-detail">Watched — loved it</span></span></button>
</div>
