<button class="modal-close" data-close-modal>✕</button>
<h3>New note</h3>
<label>What?</label><input type="text" placeholder="e.g. Call the dentist" />
<label>Details</label><textarea placeholder="Any extra info…"></textarea>
<label>Type</label><select><option>Note</option><option>Event</option><option>Bucket</option><option>Habit</option></select>
<label>Date & time</label><input type="datetime-local" />
<label>Colour</label>
<div class="colour-options"><span class="colour-dot butter"></span><span class="colour-dot tea selected"></span><span class="colour-dot periwinkle"></span><span class="colour-dot mint"></span></div>
<div class="modal-actions"><button class="btn-modal-primary">Save note</button></div>
