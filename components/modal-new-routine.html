<button class="modal-close" data-close-modal>✕</button>
<h3>New routine</h3>
<label>Name</label><input type="text" placeholder="e.g. Afternoon reset" />
<label>Anchor time (wake-up / start)</label><input type="time" />
<label>Active days</label>
<div class="day-picker"><button>M</button><button>T</button><button>W</button><button>T</button><button>F</button><button>S</button><button>S</button></div>
<label>Add blocks by voice or text</label><textarea placeholder="e.g. 2:00 Walk 20 min, 2:25 Tea 10 min…"></textarea>
<p style="font-size:var(--fs-xs);color:var(--text-muted);">Sinéad will parse your block list and build the timeline for you to review.</p>
<div class="modal-actions"><button class="btn-modal-primary">Create routine</button></div>
