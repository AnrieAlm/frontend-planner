<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Petal Planner</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700&family=Caveat:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/bottom-nav.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/today.css" />
  <link rel="stylesheet" href="css/routine.css" />
  <link rel="stylesheet" href="css/notes.css" />
  <link rel="stylesheet" href="css/calendar.css" />
  <link rel="stylesheet" href="css/habits.css" />
  <link rel="stylesheet" href="css/grocery.css" />
  <link rel="stylesheet" href="css/bucketlist.css" />
  <link rel="stylesheet" href="css/settings.css" />
  <link rel="stylesheet" href="css/modals.css" />
</head>
<body>

  <div id="auth-screen" class="screen active">
    <div id="auth-container"></div>
  </div>

  <div id="app-shell" class="screen hidden">
    <aside id="sidebar"></aside>
    <main id="main-content">
      <section id="page-today"      class="page active"></section>
      <section id="page-routine"    class="page hidden"></section>
      <section id="page-notes"      class="page hidden"></section>
      <section id="page-calendar"   class="page hidden"></section>
      <section id="page-habits"     class="page hidden"></section>
      <section id="page-grocery"    class="page hidden"></section>
      <section id="page-bucketlist" class="page hidden"></section>
      <section id="page-settings"   class="page hidden"></section>
    </main>
    <nav id="bottom-nav"></nav>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <script src="js/emoji-icons.js"></script>
  <script src="js/app.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/today.js"></script>
  <script src="js/routine.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/grocery.js"></script>
  <script src="js/bucketlist.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/sinead-ai.js"></script>
</body>
</html>
